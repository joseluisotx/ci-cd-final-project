apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE
      description: The built image URL to push
      type: string
    - name: DOCKERFILE
      description: Path to the Dockerfile
      type: string
      default: ./Dockerfile
    - name: CONTEXT
      description: Build context path
      type: string
      default: .
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:latest
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsUser: 1000
      env:
        - name: STORAGE_DRIVER
          value: vfs
      script: |
        #!/bin/bash
        set -e

        # Read the service account token automatically mounted in every pod
        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

        echo "Logging in to internal registry using service account token..."
        buildah --storage-driver=vfs login \
          --tls-verify=false \
          -u serviceaccount \
          -p $TOKEN \
          image-registry.openshift-image-registry.svc:5000

        echo "Building image $(params.IMAGE) ..."
        buildah --storage-driver=vfs bud \
          --format=oci \
          --tls-verify=false \
          -f $(params.DOCKERFILE) \
          -t $(params.IMAGE) \
          $(params.CONTEXT)

        echo "Pushing image $(params.IMAGE) ..."
        buildah --storage-driver=vfs push \
          --tls-verify=false \
          $(params.IMAGE) \
          docker://$(params.IMAGE)

        echo "Build and push complete."