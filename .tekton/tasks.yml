---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE
      description: The target image URL to push
      type: string
    - name: DOCKERFILE
      description: Path to the Dockerfile
      type: string
      default: ./Dockerfile
    - name: CONTEXT
      description: Build context path
      type: string
      default: .
  steps:
    - name: build-and-push
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e

        # Extract just the app name from the full image URL
        # e.g. image-registry.../sn-labs-joseluisotx/ci-cd-final-project:latest
        # becomes: ci-cd-final-project
        APP_NAME=$(echo "$(params.IMAGE)" \
          | awk -F'/' '{print $NF}' \
          | awk -F':' '{print $1}')

        echo "App name: ${APP_NAME}"
        echo "Target image: $(params.IMAGE)"

        # Create BuildConfig if it doesn't already exist
        if ! oc get bc/${APP_NAME} 2>/dev/null; then
          echo "Creating BuildConfig ${APP_NAME}..."
          oc new-build \
            --binary \
            --strategy=docker \
            --name=${APP_NAME} \
            --to=$(params.IMAGE) \
            -l app=${APP_NAME}
        else
          echo "BuildConfig ${APP_NAME} already exists, skipping create."
        fi

        # Start the binary build from the workspace source directory
        echo "Starting build from source..."
        oc start-build ${APP_NAME} \
          --from-dir=$(params.CONTEXT) \
          --follow \
          --wait

        echo "Build and push complete."